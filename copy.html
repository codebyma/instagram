<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문구 복사</title>
<style>
:root{
  --bg:#f1f3f6; --card:#ffffff; --ink:#151a22; --sub:#5d6675; --line:#d9dee6;
  --accent:#2457f5; --accent-ink:#ffffff; --danger:#c62f3b; --ok:#16794c;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#10141a; --card:#1a2029; --ink:#e8ecf2; --sub:#9aa5b5; --line:#2b3441; --accent:#6c92ff; --accent-ink:#0c1220; --danger:#ff7b86; --ok:#4cc38a;}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 Pretendard,"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;padding:20px 16px 80px}
main{max-width:720px;margin:0 auto}
h1{font-size:22px;margin:0 0 16px;letter-spacing:-.01em}
h2{font-size:15px;margin:28px 0 10px;color:var(--sub);font-weight:600}
textarea,input[type=text],input[type=password]{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
textarea{min-height:110px;resize:vertical}
textarea:focus,input:focus,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
button{font:inherit;font-size:15px;line-height:1;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 14px;cursor:pointer;min-height:40px}
button:hover{border-color:var(--sub)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.danger{color:var(--danger)}
button:disabled{opacity:.5;cursor:default}
.spacer{flex:1}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:20px}
.item-title{font-weight:600;font-size:16px;margin:28px 2px 8px;word-break:break-word}
.item-title:first-child{margin-top:0}
.item .text{white-space:pre-wrap;word-break:break-word;font-size:17px}
.item .row{margin-top:10px}
.item.copied{border-color:var(--ok)}
.empty{color:var(--sub);padding:18px 4px}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.bar input{flex:1;min-width:140px}
.status{font-size:13px;color:var(--sub)}
.status.dirty{color:var(--danger);font-weight:600}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-top:10px}
summary{cursor:pointer;font-weight:600;font-size:14px}
label{display:block;font-size:13px;color:var(--sub);margin:12px 0 4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:480px){.grid{grid-template-columns:1fr}}
.hint{font-size:13px;color:var(--sub);margin:8px 0 0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<main>
  <h1>문구 복사</h1>

  <div class="bar">
    <input type="text" id="search" placeholder="문구 검색" aria-label="문구 검색">
    <span class="status" id="status"></span>
  </div>
  <div id="list"></div>

  <h2>새 문구</h2>
  <input type="text" id="quickTitle" placeholder="제목 (선택)" aria-label="제목" style="margin-bottom:8px">
  <textarea id="quick" placeholder="텍스트를 입력하세요" aria-label="텍스트 입력"></textarea>
  <div class="row">
    <button class="primary" id="quickCopy">복사</button>
    <button id="quickSave">문구로 저장</button>
    <button id="quickClear">지우기</button>
  </div>

  <h2>GitHub에 저장</h2>
  <div class="row" style="margin-top:0">
    <input type="text" id="msg" placeholder="커밋 메시지 (비워두면 자동 입력)" aria-label="커밋 메시지" style="flex:1;min-width:200px">
    <button class="primary" id="commit">커밋</button>
  </div>
  <div class="row">
    <button id="pull">저장소 내용 불러오기</button>
    <button id="download">JSON 다운로드</button>
  </div>

  <details id="settings">
    <summary>GitHub 설정</summary>
    <div class="grid">
      <div><label for="sOwner">계정(owner)</label><input type="text" id="sOwner" autocomplete="off"></div>
      <div><label for="sRepo">저장소(repo)</label><input type="text" id="sRepo" autocomplete="off"></div>
      <div><label for="sBranch">브랜치</label><input type="text" id="sBranch" placeholder="main" autocomplete="off"></div>
      <div><label for="sPath">저장 파일 경로</label><input type="text" id="sPath" placeholder="phrases.json" autocomplete="off"></div>
    </div>
    <label for="sToken">Personal Access Token</label>
    <input type="password" id="sToken" autocomplete="off" placeholder="github_pat_...">
    <p class="hint">Fine-grained 토큰을 이 저장소 하나에만, Contents 권한을 Read and write로 발급하세요. 토큰은 이 브라우저의 localStorage에만 저장되고 코드나 저장소에는 올라가지 않습니다. 개인 기기에서만 사용하세요.</p>
    <div class="row"><button id="sSave">설정 저장</button></div>
  </details>
</main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const LS = {draft:'phrases-draft', dirty:'phrases-dirty', cfg:'phrases-gh-config'};
  let phrases = [];
  let editingId = null;

  // ---------- util ----------
  function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2)); }
  function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  let tt;
  function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),2200); }
  async function copyText(text){
    try{ await navigator.clipboard.writeText(text); return true; }catch(e){
      const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      let ok=false; try{ ok=document.execCommand('copy'); }catch(_){}
      ta.remove(); return ok;
    }
  }
  function toBase64(str){
    const bytes=new TextEncoder().encode(str); let bin='';
    bytes.forEach(b=>bin+=String.fromCharCode(b)); return btoa(bin);
  }
  function fromBase64(b64){
    const bin=atob(b64.replace(/\s/g,'')); const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
    return new TextDecoder().decode(bytes);
  }

  // ---------- state ----------
  function setDirty(v){ lsSet(LS.dirty, v?'1':'0'); renderStatus(); }
  function isDirty(){ return lsGet(LS.dirty)==='1'; }
  function persist(){ lsSet(LS.draft, JSON.stringify(phrases)); setDirty(true); render(); }
  function normalize(data){
    const arr = Array.isArray(data) ? data : (data && Array.isArray(data.phrases) ? data.phrases : []);
    return arr.filter(p=>p && typeof p.text==='string').map(p=>({id:p.id||uid(), title:p.title||'', text:p.text}));
  }
  function renderStatus(){
    const s=$('status');
    s.textContent = isDirty() ? '커밋 안 된 변경 있음' : '저장소와 동일';
    s.className = 'status' + (isDirty() ? ' dirty' : '');
  }

  // ---------- render ----------
  function render(){
    const q=$('search').value.trim().toLowerCase();
    const box=$('list'); box.textContent='';
    const shown = phrases.filter(p=>!q || p.text.toLowerCase().includes(q) || p.title.toLowerCase().includes(q));
    if(!shown.length){
      const d=document.createElement('div'); d.className='empty';
      d.textContent = phrases.length ? '검색 결과가 없습니다.' : '저장된 문구가 없습니다. 위에 입력하고 "문구로 저장"을 누르세요.';
      box.appendChild(d);
    }
    shown.forEach(p=>{
      const el=document.createElement('div'); el.className='item';
      if(editingId===p.id){
        const ti=document.createElement('input'); ti.type='text'; ti.value=p.title; ti.placeholder='제목 (선택)'; ti.setAttribute('aria-label','제목');
        const ta=document.createElement('textarea'); ta.value=p.text; ta.style.marginTop='8px'; ta.setAttribute('aria-label','문구 내용');
        const row=document.createElement('div'); row.className='row';
        const ok=btn('저장','primary',()=>{
          if(!ta.value.trim()){ toast('내용을 입력하세요'); return; }
          p.title=ti.value.trim(); p.text=ta.value; editingId=null; persist(); toast('수정했습니다');
        });
        const cancel=btn('취소','',()=>{ editingId=null; render(); });
        row.append(ok,cancel); el.append(ti,ta,row);
      } else {
        if(p.title){ const t=document.createElement('div'); t.className='item-title'; t.textContent=p.title; box.appendChild(t); }
        const tx=document.createElement('div'); tx.className='text'; tx.textContent=p.text; el.appendChild(tx);
        const row=document.createElement('div'); row.className='row';
        row.append(
          btn('복사','primary',async()=>{
            const ok=await copyText(p.text);
            toast(ok?'복사했습니다':'복사하지 못했습니다');
            if(ok){ el.classList.add('copied'); setTimeout(()=>el.classList.remove('copied'),1200); }
          }),
          spacer(),
          btn('수정','',()=>{ editingId=p.id; render(); }),
          btn('삭제','danger',()=>{
            if(confirm('이 문구를 삭제할까요?')){ phrases=phrases.filter(x=>x.id!==p.id); persist(); toast('삭제했습니다'); }
          })
        );
        el.appendChild(row);
      }
      box.appendChild(el);
    });
    renderStatus();
  }
  function btn(label,cls,fn){ const b=document.createElement('button'); b.type='button'; b.textContent=label; if(cls) b.className=cls; b.addEventListener('click',fn); return b; }
  function spacer(){ const s=document.createElement('span'); s.className='spacer'; return s; }

  // ---------- GitHub ----------
  function defaults(){
    const cfg={owner:'',repo:'',branch:'main',path:'phrases.json',token:''};
    const h=location.hostname;
    if(h.endsWith('.github.io')){
      cfg.owner=h.split('.')[0];
      const seg=location.pathname.split('/')[1];
      if(seg && !seg.includes('.')) cfg.repo=seg; else cfg.repo=h;
    }
    return cfg;
  }
  function loadCfg(){
    let saved={}; try{ saved=JSON.parse(lsGet(LS.cfg)||'{}'); }catch(e){}
    return Object.assign(defaults(), saved);
  }
  function fillCfg(){
    const c=loadCfg();
    $('sOwner').value=c.owner; $('sRepo').value=c.repo; $('sBranch').value=c.branch; $('sPath').value=c.path; $('sToken').value=c.token;
  }
  function readCfg(){
    return {
      owner:$('sOwner').value.trim(), repo:$('sRepo').value.trim(),
      branch:$('sBranch').value.trim()||'main', path:$('sPath').value.trim()||'phrases.json',
      token:$('sToken').value.trim()
    };
  }
  function needCfg(){
    const c=loadCfg();
    if(!c.owner||!c.repo||!c.token){
      $('settings').open=true; toast('GitHub 설정을 먼저 입력하세요'); return null;
    }
    return c;
  }
  function api(c){ return `https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/contents/${c.path.split('/').map(encodeURIComponent).join('/')}`; }
  function headers(c){ return {'Authorization':'Bearer '+c.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}; }

  async function commit(){
    const c=needCfg(); if(!c) return;
    const b=$('commit'); b.disabled=true; b.textContent='커밋 중...';
    try{
      const url=api(c);
      let sha;
      const g=await fetch(url+'?ref='+encodeURIComponent(c.branch),{headers:headers(c),cache:'no-store'});
      if(g.ok){ sha=(await g.json()).sha; }
      else if(g.status!==404){ throw new Error(await errMsg(g)); }
      const body={
        message:$('msg').value.trim()||('문구 업데이트 '+new Date().toLocaleString('ko-KR')),
        content:toBase64(JSON.stringify(phrases,null,2)+'\n'),
        branch:c.branch
      };
      if(sha) body.sha=sha;
      const r=await fetch(url,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},headers(c)),body:JSON.stringify(body)});
      if(!r.ok) throw new Error(await errMsg(r));
      setDirty(false); $('msg').value=''; toast('커밋했습니다');
    }catch(e){ toast('커밋 실패: '+e.message); }
    finally{ b.disabled=false; b.textContent='커밋'; }
  }
  async function errMsg(r){
    let m=''; try{ m=(await r.json()).message; }catch(e){}
    if(r.status===401) return '토큰이 올바르지 않습니다';
    if(r.status===403||r.status===404) return (m||'권한 또는 저장소 설정을 확인하세요')+' ('+r.status+')';
    if(r.status===409||r.status===422) return '파일이 다른 곳에서 바뀌었습니다. 불러온 뒤 다시 시도하세요';
    return m||('오류 '+r.status);
  }
  async function pull(){
    if(isDirty() && !confirm('커밋 안 된 변경이 사라집니다. 저장소 내용을 불러올까요?')) return;
    const c=loadCfg();
    try{
      let data;
      if(c.token && c.owner && c.repo){
        const r=await fetch(api(c)+'?ref='+encodeURIComponent(c.branch),{headers:headers(c),cache:'no-store'});
        if(r.status===404){ data=[]; }
        else if(!r.ok) throw new Error(await errMsg(r));
        else data=JSON.parse(fromBase64((await r.json()).content));
      } else {
        const r=await fetch(c.path+'?t='+Date.now(),{cache:'no-store'});
        if(!r.ok) throw new Error('파일을 찾을 수 없습니다');
        data=await r.json();
      }
      phrases=normalize(data); lsSet(LS.draft,JSON.stringify(phrases)); setDirty(false); editingId=null; render(); toast('불러왔습니다');
    }catch(e){ toast('불러오기 실패: '+e.message); }
  }

  // ---------- events ----------
  $('quickCopy').onclick=async()=>{
    const v=$('quick').value; if(!v){ toast('내용을 입력하세요'); return; }
    toast((await copyText(v))?'복사했습니다':'복사하지 못했습니다');
  };
  $('quickSave').onclick=()=>{
    const v=$('quick').value; if(!v.trim()){ toast('내용을 입력하세요'); return; }
    phrases.unshift({id:uid(),title:$('quickTitle').value.trim(),text:v}); $('quick').value=''; $('quickTitle').value=''; persist(); toast('문구로 저장했습니다');
  };
  $('quickClear').onclick=()=>{ $('quick').value=''; $('quickTitle').value=''; $('quickTitle').focus(); };
  $('search').addEventListener('input',render);
  $('commit').onclick=commit;
  $('pull').onclick=pull;
  $('download').onclick=()=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([JSON.stringify(phrases,null,2)+'\n'],{type:'application/json'}));
    a.download='phrases.json'; a.click(); URL.revokeObjectURL(a.href);
  };
  $('sSave').onclick=()=>{ lsSet(LS.cfg,JSON.stringify(readCfg())); toast('설정을 저장했습니다'); };

  // ---------- init ----------
  fillCfg();
  (async function init(){
    const draft=lsGet(LS.draft);
    if(draft){ try{ phrases=normalize(JSON.parse(draft)); render(); return; }catch(e){} }
    try{
      const r=await fetch(loadCfg().path+'?t='+Date.now(),{cache:'no-store'});
      if(r.ok){ phrases=normalize(await r.json()); lsSet(LS.draft,JSON.stringify(phrases)); setDirty(false); }
    }catch(e){}
    render();
  })();
})();
</script>
</body>
</html>
